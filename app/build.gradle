plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.fotoraport.app'
    compileSdk 34

    defaultConfig {
        applicationId "pl.fotoraport.app"
        minSdk 29
        targetSdk 34
        // numer wersji ustawia GitHub przy każdym budowaniu (patrz .github/workflows/build.yml)
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "2.2"
    }

    // Dwie osobne aplikacje z jednego kodu, instalowane obok siebie:
    //  - fotoraport: Networks! (dawniej Foto Raport; OPL / TMPL), assets z src/main
    //  - plusdoc:    Cellnex-Nokia (ECLIPSE), assets z src/plusdoc
    flavorDimensions "app"
    productFlavors {
        fotoraport {
            dimension "app"
            applicationId "pl.fotoraport.app"
            resValue "string", "app_name", "Networks!"
            resValue "string", "media_dir", "FotoRaport"
        }
        plusdoc {
            dimension "app"
            applicationId "pl.plusdoc.zdjecia"
            versionName "2.5"
            resValue "string", "app_name", "Cellnex-Nokia"
            resValue "string", "media_dir", "CellnexNokia"
        }
    }

    // Stały klucz podpisu: dzięki niemu nowa wersja instaluje się na starą i nie kasuje zdjęć w aplikacji.
    signingConfigs {
        fotoraport {
            storeFile file('fotoraport.jks')
            storePassword 'FotoRaport2026'
            keyAlias 'fotoraport'
            keyPassword 'FotoRaport2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fotoraport
        }
        debug {
            signingConfig signingConfigs.fotoraport
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    // odczyt kodów z tabliczek (DataMatrix / Code 128) – model wbudowany, działa bez internetu
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // skaner dokumentów (listy przewozowe, WZ) – przez Google Play services, bez uprawnienia CAMERA
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    // ML Kit ciągnie stare kotlin-stdlib-jdk7/jdk8 – wyrównanie wersji (inaczej „Duplicate class kotlin…”)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
