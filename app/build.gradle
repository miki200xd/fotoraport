plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.fotoraport.app'
    compileSdk 34

    defaultConfig {
        applicationId "pl.fotoraport.app"
        minSdk 29
        targetSdk 34
        // numer wersji ustawia GitHub przy każdym budowaniu (patrz .github/workflows/build.yml)
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.9"
    }

    // Dwie osobne aplikacje z jednego kodu, instalowane obok siebie:
    //  - fotoraport: Networks! (dawniej Foto Raport; OPL / TMPL), assets z src/main
    //  - plusdoc:    Cellnex-Nokia (ECLIPSE), assets z src/plusdoc
    //  - pdu:        PDU Skaner (inwentaryzacja listew PDU w DC: S/N + MAC ETH1/ETH2), assets z src/pdu
    flavorDimensions "app"
    productFlavors {
        fotoraport {
            dimension "app"
            applicationId "pl.fotoraport.app"
            resValue "string", "app_name", "Networks!"
            resValue "string", "media_dir", "FotoRaport"
        }
        plusdoc {
            dimension "app"
            applicationId "pl.plusdoc.zdjecia"
            versionName "1.8"
            resValue "string", "app_name", "Cellnex-Nokia"
            resValue "string", "media_dir", "CellnexNokia"
        }
        pdu {
            dimension "app"
            applicationId "pl.wac.pduskaner"
            versionName "1.9"
            resValue "string", "app_name", "Data Center"
            resValue "string", "media_dir", "PduSkaner"
        }
        // PDU Skaner TEST: ten sam kod co pdu, osobna aplikacja (instaluje się obok –
        // wersja do pracy zostaje jako zapas, nowe funkcje najpierw tu)
        pdutest {
            dimension "app"
            applicationId "pl.wac.pduskaner.test"
            versionName "1.9"
            resValue "string", "app_name", "Data Center TEST"
            resValue "string", "media_dir", "PduSkanerTest"
        }
    }

    sourceSets {
        pdutest {
            assets.srcDirs = ['src/pdu/assets']
            manifest.srcFile 'src/pdu/AndroidManifest.xml'
        }
    }

    // Stały klucz podpisu: dzięki niemu nowa wersja instaluje się na starą i nie kasuje zdjęć w aplikacji.
    signingConfigs {
        fotoraport {
            storeFile file('fotoraport.jks')
            storePassword 'FotoRaport2026'
            keyAlias 'fotoraport'
            keyPassword 'FotoRaport2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fotoraport
        }
        debug {
            signingConfig signingConfigs.fotoraport
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    // odczyt napisów z oznaczników i naklejek S/N kabli (PDU Skaner – tryb Kable), model w APK, offline
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // ML Kit ciągnie stdlib Kotlina w kilku wersjach – wyrównanie, żeby nie było „Duplicate class kotlin…”
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
