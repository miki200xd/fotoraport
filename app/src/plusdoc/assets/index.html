<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#14201C; --muted:#56665F; --line:#CFD9D4;
  --accent:#1F5FAF; --accent-ink:#FFFFFF; --accent-soft:#DCE8F7;
  --ok:#1D7F46; --ok-soft:#D8EFE1; --warn:#9A6400; --warn-soft:#F6E8C8; --danger:#B42318;
  --shadow:0 1px 2px rgba(20,32,28,.08),0 4px 14px rgba(20,32,28,.06);
  --display:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#17201D; --sunk:#111916; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3632;
    --accent:#6AA8F0; --accent-ink:#06121F; --accent-soft:#15263A;
    --ok:#4CC27F; --ok-soft:#163324; --warn:#E3B04B; --warn-soft:#352A12; --danger:#FF7B6E;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#17201D; --sunk:#111916; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3632;
  --accent:#6AA8F0; --accent-ink:#06121F; --accent-soft:#15263A;
  --ok:#4CC27F; --ok-soft:#163324; --warn:#E3B04B; --warn-soft:#352A12; --danger:#FF7B6E;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:24px;overflow-wrap:anywhere} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;user-select:none}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn-danger{color:var(--danger)}
.btn-block{width:100%}
.btn-big{min-height:64px;font-size:18px;line-height:1.1;font-family:var(--display);letter-spacing:.03em;text-transform:uppercase}
button:disabled{opacity:.45;cursor:default}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.field span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],textarea{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-height:48px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;min-width:48px;flex:1;min-height:44px;padding:6px 10px;font-family:var(--display);font-size:19px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.secbox{border-top:1px solid var(--line);padding-top:12px;gap:8px}
select.secsel{font:inherit;font-size:15px;min-height:44px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:70%}
.g5card{border-color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.cfgrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
/* station cards */
.st{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.st h3{font-size:22px}
/* item list */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .cnt{font-family:var(--display);font-size:15px;opacity:.75}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:52px 1fr 60px;gap:12px;align-items:center;padding:10px 12px;border:0;border-radius:0;background:transparent;text-align:left;min-height:72px;width:100%;font-weight:400}
.item+.item{border-top:1px solid var(--line)}
.plate{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:26px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.item.done .plate{background:var(--ok);color:#fff}
.item.skip .plate{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.item .t{font-weight:600;line-height:1.25}
.item .d{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.thumb.empty{border:1px dashed var(--line);background:transparent}
.cnt-badge{font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin-top:2px}
/* shoot */
.marker{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.marker .big{font-family:var(--display);font-weight:700;font-size:72px;line-height:.9;min-width:90px;height:96px;padding:0 10px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.marker.done .big{background:var(--ok);color:#fff}
.preview{width:100%;max-width:100%;aspect-ratio:3/4;max-height:58vh;border-radius:12px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-inline:auto}
.preview img{width:100%;height:100%;object-fit:contain}
.preview .ph{color:var(--muted);text-align:center;padding:24px;font-size:15px;overflow-wrap:anywhere;min-width:0;max-width:100%}
.takes{display:flex;gap:10px;overflow-x:auto;padding-block:4px}
.take{position:relative;flex:0 0 auto;padding:0;border:3px solid transparent;border-radius:10px;background:none;min-height:0}
.take img{width:72px;height:96px;object-fit:cover;border-radius:7px;display:block}
.take[aria-pressed="true"]{border-color:var(--ok)}
.take .lbl{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 5px}
.navrow{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.sticky-actions{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 80%,transparent)}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.notice{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.qbadge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;z-index:40;box-shadow:var(--shadow)}
.preview{position:relative}
.pendtag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.notice.info{background:var(--sunk);color:var(--muted)}
.missing{font-family:var(--display);font-size:17px;letter-spacing:.02em}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60}
.busy div{background:var(--surface);color:var(--ink);padding:18px 22px;border-radius:12px;font-weight:600}
.empty-state{text-align:center;padding:28px 8px}
@media (prefers-reduced-motion:no-preference){ .item,.take,button{transition:background-color .15s,border-color .15s} }
</style>

</head>

function shortV3(s,phase){

function buildCatalog(raw,ver){
  const cat={};
  for(const r of REPORTS){
    cat[r.f]=(raw[r.f]||[]).map(([n,l,d])=>{
      l=(l||'').replace(/\s*:\s*$/,'').trim(); d=(d||'').trim();
      let title,desc,extra,opt,phase='',deinst=false,share=null;
      if(ver==='v1'){
        if(r.f==='BTS'&&(n===24||n===25)) l=l.replace('RRU/RRH 2','RRU/RRH 1');
        if(r.f==='System Antenowy'&&n>=64&&n<=66){ l=l.replace('Sektor 3','Sektor 4'); d=d.replace('Sektor 3','Sektor 4'); }
        title=l; desc=d; extra=!title||/^Dodatkowe zdj/i.test(title); if(!title) title='Dodatkowe zdjęcie';
        if(norm(desc)===norm(title)) desc='';
        opt=extra||/opcja/i.test(d);
        if(n===1) share='common/1';
      } else {
        if(r.f==='System Antenowy'&&n>=75&&n<=77){ l=l.replace('Sektor 3','Sektor 4'); d=d.replace('Sektor 3','Sektor 4'); }
        const full=d||l; phase=phaseOf(full); deinst=/^Zdeinstalowany sprzęt/i.test(full);
        title=shortV3(full,phase);
        const notes=[]; if(norm(full)!==norm(title)) notes.push(full);
        if(l && d && norm(l)!==norm(d)) notes.push('W raporcie Excel podpisane: „'+l+'”');
        desc=notes.join(' · ');
        extra=/^Dodatkowe zdj/i.test(full) && !/(GPS|bezpiecznik|sterownika)/i.test(full);
        opt=extra||/opcja/i.test(full);
        if(r.f!=='Inne' && n<=12) share='common/'+n;
        if(r.f==='Inne' && n===1) share='common/1';
        if(/^Wartość prądu poboru/i.test(full)) share='common/prad';
      }
      const m=(re)=>{const x=title.match(re); return x?+x[1]:0};
      const tags={ sec:m(/\bS([1-4])\b/)||m(/Sektor\s*([1-4])/i), rru:m(/RRU\/RRH\s*(\d)/), ant:m(/ant(?:ena|\.)\s*(\d)/i), odu:m(/ODU\s*(\d)/), bat:m(/baterii\s*(\d)/i) };
      return {n,title,desc,extra,opt,phase,deinst,share,tags};
    });
    const a=cat[r.f]; let i=0;
    while(i<a.length){ let j=i; while(j+1<a.length && !a[i].extra && a[j+1].title===a[i].title && a[j+1].n===a[j].n+1) j++;
      const mm=j-i+1; if(mm>1) for(let k=i;k<=j;k++) a[k].ser={k:k-i+1,m:mm}; i=j+1; }
  }

}

const DB = {
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      let req;
      try{ req = indexedDB.open('fotoraport',1); }catch(e){ rej(e); return; }
      req.onupgradeneeded = ()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
        if(!db.objectStoreNames.contains('photos')){ const s=db.createObjectStore('photos',{keyPath:'id'}); s.createIndex('projectId','projectId'); }
      };
      req.onsuccess=()=>{this.db=req.result;res(this.db)};
      req.onerror=()=>rej(req.error);
    });
  },
  async run(store,mode,fn){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(store,mode); const s=tx.objectStore(store);
      let out; const r=fn(s); if(r) r.onsuccess=()=>{out=r.result};
      tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
    });
  },
  all(store){return this.run(store,'readonly',s=>s.getAll())},
  get(store,id){return this.run(store,'readonly',s=>s.get(id))},
  put(store,v){return this.run(store,'readwrite',s=>s.put(v))},
  del(store,id){return this.run(store,'readwrite',s=>s.delete(id))},
  photosOf(pid){return this.run('photos','readonly',s=>s.index('projectId').getAll(pid))}
};

/* ===== Parser G5 N! Radio (tekst z PDF, linia po linii; lines.cols = [{l,r}] kolumny lewa/prawa) ===== */
const G5_JUNK=/^(NetWorks?!? Sp\.|Prezes Zarządu|Członek Zarządu|Spółka zarejestrowana|KRS \d|Kapitał zakładowy|TAJEMNICA N|Page \d+ of \d+|\d+ G5 N! Radio)/i;
function g5Equipment(rawLines){
  const cols=rawLines.cols; const out={install:[],deinstall:[]};
  if(!cols) return out;
  const i0=rawLines.findIndex(s=>/^\s*2\.\s*EQUIPMENT\b/i.test(s)); if(i0<0) return out;
  let last={l:null,r:null};
  for(let i=i0+1;i<rawLines.length;i++){
    const s=rawLines[i];
    if(/BaseBand current|MSITES CURRENT|^\s*\d+\.\s*(BBU|SECTORS|EQUIPMENT TO ORDER)/i.test(s)) break;
    if(G5_JUNK.test(s.trim())) continue;
    for(const [side,list] of [['l',out.deinstall],['r',out.install]]){
      const t=(cols[i]&&cols[i][side]||'').replace(/\s+/g,' ').trim(); if(!t) continue;
      if(/(^|\s)Qty$/i.test(t)||/^(DE)?INSTALLATION$/i.test(t)||/\/none\//i.test(t)){ last[side]=null; continue; }
      const m=t.match(/^(.*\S)\s+(\d+)$/);
      if(m){ const it={name:m[1],qty:+m[2]}; list.push(it); last[side]=it; }
      else if(last[side] && !/^[A-Z]{3}\d{5}O[A-Z]\b/.test(t)) last[side].name+=' '+t;
    }
  }
  return out;
}
function parseG5(rawLines){
  const equipment=g5Equipment(rawLines);
  const L = rawLines.map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean).filter(s=>!G5_JUNK.test(s));
  const all = L.join('\n');
  const g = (re,i=1)=>{ const m=all.match(re); return m?m[i].trim():''; };
  const r = {
    nr: g(/\bN!?\s?Code\s+(\d+)/),
    nName: g(/\bN!?\s?Name\s+(.+?)(?:\s+Mno\b|\n|$)/),
    mno: g(/\bMno\s+([A-Z]+)/),
    oplCode: g(/OPL Code\s+(\d+)/),
    oplName: g(/OPL Name\s+(.+?)(?:\n|$)/),
    tmplCode: g(/^TMPL\s+(\d+)/m),
    tmplName: g(/^TMPL\s+\d+\s+TMPL\s+(.+?)(?:\n|$)/m),
    place: g(/Place\s+(.+?)\s+Province/),
    klass: g(/\bClass\s+(\S+)/),
    height: g(/\bClass\s+\S+\s+Height\s+(\d+)/),
    task: g(/^Task\s+(.+?)(?:\n|$)/m),
    taskId: g(/TaskObjId\s+(\d+)/),
    bbu: [], sectors: [], equipment
  };
  if(!r.nr){ const m=all.match(/^(\d{4,6})\s/m); if(m && /N!?\s?Name|OPL Code|SECTORS/.test(all)) r.nr=m[1]; }
  if(!r.nr) return null;
  // BBU
  const iB=L.findIndex(s=>/^\d+\.\s*BBU CONFIGURATION/i.test(s)), iS=L.findIndex(s=>/^\d+\.\s*SECTORS/i.test(s));
  if(iB>=0){
    let cur=null;
    for(const s of L.slice(iB+1, iS>iB?iS:undefined)){
      let m=s.match(/^\d+\s+(BBU\S+)\s*-\s*(\S+)/);
      if(m){ cur={name:m[1],type:m[2],slots:[]}; r.bbu.push(cur); continue; }
      m=s.match(/^(\d{1,2})\s+([A-Z][A-Z0-9]{2,5})\s+(No action|INSTALLATION|DEINSTALLATION|MODIFICATION|RELOCATION|REPLACEMENT)\b/i);
      if(m&&cur) cur.slots.push({slot:+m[1],card:m[2],action:m[3]});
    }
  }
  // Sektory
  const iE=L.findIndex(s=>/^\d+\.\s*EQUIPMENT TO ORDER/i.test(s));
  const secLines=L.slice(iS>=0?iS+1:0, iE>0?iE:undefined);
  const blocks=[]; let b=null;
  for(const s of secLines){ if(/^Name\s+\S+/i.test(s) && /Azimuth|Height|SEC/i.test(s)){ b=[s]; blocks.push(b);} else if(b) b.push(s); }
  const BANDS=/(GSM 900|GSM 1800|UMTS 900|UMTS 2100|LTE 800|LTE 1800|LTE 2100|LTE 2600|TDD 3600|NR 700|NR 3500|NR 2100)\s+((?:NULL|DISTRIBUTED|->|[A-Z]+)+)/g;
  const EQ=/^(No change|INSTALLATION|DEINSTALLATION|MODIFICATION|RELOCATION)\s+(.+?)\s+(ANTENNAS AUX|ANTENNAS NR|ANTENNAS|RRU|RRH|RADIO|AAU)\b\s*(\d*)/;
  for(const bl of blocks){
    const t=bl.join('\n');
    const gg=(re,i=1)=>{const m=t.match(re);return m?m[i].trim():''};
    const bands=[]; let m; BANDS.lastIndex=0;
    while((m=BANDS.exec(t))){ const v=m[2]; const after=v.includes('->')?v.split('->').pop():v; const before=v.includes('->')?v.split('->')[0]:v;
      if(after&&after!=='NULL') bands.push({band:m[1],change:v.includes('->')?(before==='NULL'||!before?'nowe':'zmiana'):''});
      else if(before&&before!=='NULL') bands.push({band:m[1],change:'usuwane'}); }
    // anteny: podbloki ANTn
    const ants=[]; let a=null;
    for(const s of bl){ const am=s.match(/^ANT(\d+)\b/); if(am){ a={n:+am[1],lines:[],eq:[]}; ants.push(a); continue; } if(a){ a.lines.push(s); const e=s.match(EQ); if(e) a.eq.push({action:e[1],name:e[2],cls:e[3],qty:+e[4]||1}); } }
    for(const x of ants){ const main=x.eq.filter(e=>e.cls!=='ANTENNAS AUX'); x.removed = main.length>0 && main.every(e=>e.action==='DEINSTALLATION'); }
    const kept=ants.filter(x=>!x.removed);
    const rrus=new Set(kept.flatMap(x=>x.lines.join(' ').match(/\bRRU_[A-Z0-9]+/g)||[]));
    const eq=ants.flatMap(x=>x.eq.map(e=>({...e,ant:x.n})));
    const work = eq.some(e=>e.action!=='No change') ;
    const rawName=gg(/^Name\s+(\S+)/m);
    const removed=/->\s*DEINSTALLATION/i.test(rawName) || (ants.length>0 && kept.length===0);
    r.sectors.push({
      removed, name:rawName.replace(/->.*$/,''), no:+gg(/^No\s+(\d+)/m)||r.sectors.length+1,
      height:gg(/Height\s+(\d+(?:[.,]\d+)?)\s*m/), az:gg(/Azimuth\s+(\d+)/),
      type:gg(/^No\s+\d+\s+Type\s+(.+)$/m), bands, ant:kept.length||ants.length||1, antAll:ants.length, rru:rrus.size, rruNames:[...rrus], eq, work
    });
  }
  // radia do montażu z tabeli 2. EQUIPMENT
  r.radiosNew = equipment.install.filter(e=>/RRH|RRU|AAU|AQQ|AEQ|AHQ|Radio Module|RFM|\b\d+T\d+R\b/i.test(e.name)).reduce((s,e)=>s+e.qty,0);
  return r;
}

function slotKey(f,n,p=S.p){ const it=CATIDX[tplOf(p)][f]&&CATIDX[tplOf(p)][f][n]; return it&&it.share ? it.share : f+'/'+n; }
function g5HasDeinst(g){ return !!g && ((g.equipment&&g.equipment.deinstall.length>0) || (g.sectors||[]).some(s=>(s.eq||[]).some(e=>e.action==='DEINSTALLATION'))); }
function isOpt(p,it){ return !!it && (it.opt || (it.deinst && !!p.g5 && !g5HasDeinst(p.g5))); }
function slot(p,key){ return p.slots[key] || (p.slots[key]={takes:[],chosen:null,skip:false}); }
function peek(p,key){ return p.slots[key] || {takes:[],chosen:null,skip:false}; }

function hiddenByCfg(p,f,it){
  const c=p.cfg, t=it.tags;
  if(t.sec && t.sec>c.sectors) return true;
  const si=(t.sec||1)-1;
  if(isE(p)){
    if(it.cond && !(c.opts&&c.opts[it.cond])) return true;
    if(t.ant && t.ant>((c.secAnt&&c.secAnt[si])||c.ant)) return true;
    if(t.rru && t.rru>((c.secRru&&c.secRru[si])||c.rru)) return true;
    return false;
  }
  if(f==='BTS' && t.rru && t.rru>((c.secRru&&c.secRru[si])||c.rru)) return true;
  if(f==='System Antenowy' && t.ant && t.ant>((c.secAnt&&c.secAnt[si])||c.ant)) return true;
  if(f==='Radiolinia' && t.odu && t.odu>c.odu) return true;
  if(t.bat && t.bat>c.bat) return true;
  return false;
}
function itemsFor(p,f,{all=false}={}){
  let list;
  if(f==='Inne'){
    list=[{n:1,title:'Widok ogólny obiektu',desc:'',extra:false,opt:false,tags:{}}]
      .concat((p.inne||[]).map(x=>({n:x.n,title:x.opis||'Zdjęcie dodatkowe',desc:'Własny opis – wpisz go nad zdjęciem w raporcie „Inne”.',extra:false,opt:false,custom:true,tags:{}})));
  } else list=CATALOGS[tplOf(p)][f]||[];
  return list.filter(it=>{
    if(all) return true;
    if(hiddenByCfg(p,f,it)) return false;
    if(it.extra && !S.showExtra && !peek(p,slotKey(f,it.n,p)).takes.length) return false;
    return true;
  });
}
function isDone(p,f,n){ const k=slotKey(f,n,p); return !!peek(p,k).chosen || (S.pending&&S.pending[k]&&S.pending[k].length>0&&S.p&&S.p.id===p.id); }
function isSkip(p,f,n){ return !!peek(p,slotKey(f,n,p)).skip; }
function stats(p,f){
  const req = itemsFor(p,f).filter(it=>!isOpt(p,it));
  const done = req.filter(it=>isDone(p,f,it.n)||isSkip(p,f,it.n)).length;
  return {done,total:req.length};
}
function totalStats(p){
  const seen=new Set(); let done=0,total=0;
  for(const f of p.reports) for(const it of itemsFor(p,f)){ if(isOpt(p,it)) continue; const k=slotKey(f,it.n,p); if(seen.has(k)) continue; seen.add(k); total++; if(isDone(p,f,it.n)||isSkip(p,f,it.n)) done++; }
  return {done,total};
}
function sequence(p){
  const seen=new Set(), out=[];
  for(const f of p.reports) for(const it of itemsFor(p,f)){ if(S.mode==='przed' && it.phase!=='przed') continue; const k=slotKey(f,it.n,p); if(seen.has(k)) continue; seen.add(k); out.push({f,n:it.n}); }
  return out;
}
function findItem(p,f,n){ return itemsFor(p,f,{all:true}).find(it=>it.n===n); }

const CFG_DEF = {sectors:3,rru:2,ant:2,odu:2,bat:1};
function normCfg(c){ c={...CFG_DEF,...(c||{})};
  if(!Array.isArray(c.secAnt)) c.secAnt=[0,1,2,3].map(()=>c.ant);
  if(!Array.isArray(c.secRru)) c.secRru=[0,1,2,3].map(()=>c.rru);
  if(!Array.isArray(c.map)) c.map=[null,null,null,null];
  while(c.secAnt.length<6) c.secAnt.push(c.ant);
  while(c.secRru.length<6) c.secRru.push(c.rru);
  while(c.map.length<6) c.map.push(null);
  c.opts={...(c.opts||{})};
  return c; }
function secLabel(s){ return `${s.name} · ${s.az}° · ${s.height} m`; }
const ACT_PL={'No change':'','INSTALLATION':'montaż','DEINSTALLATION':'demontaż','MODIFICATION':'modyfikacja','RELOCATION':'przeniesienie'};
function secEquip(s){ const eq=(s.eq||[]).filter(e=>e.cls!=='ANTENNAS AUX'); const seen=new Set();
  const txt=eq.map(e=>`${e.name}${ACT_PL[e.action]?' ('+ACT_PL[e.action]+')':''}`).filter(x=>!seen.has(x)&&seen.add(x)).join(', ');
  return txt+(s.antAll&&s.antAll!==s.ant?` · anten po pracach: ${s.ant} (było ${s.antAll})`:''); }
function g5Sector(p,sIdx){ const no=p.cfg&&p.cfg.map&&p.cfg.map[sIdx]; return (no!=null&&p.g5)?p.g5.sectors.find(s=>s.no===no):null; }
function hwWork(s){ return !s.removed && (s.eq||[]).some(e=>/INSTALLATION|MODIFICATION|RELOCATION/.test(e.action)); }
function secDefaults(s,r){ const aau=(s.eq||[]).some(e=>/AQQ|AAU|AEQ|AHQ/i.test(e.name)&&e.action!=='DEINSTALLATION');
  let rru = aau?1:(s.rru||1);
  if(r&&r.radiosNew&&hwWork(s)){ const hw=r.sectors.filter(hwWork).length||1; rru=Math.max(rru,Math.ceil(r.radiosNew/hw)); }
  return {ant:Math.min(3,Math.max(1,s.ant||1)), rru:Math.min(5,Math.max(1,rru))}; }
function applyG5(d,r){
  d.g5=r; d.nr=r.nr||d.nr; d.nazwa=r.nName||d.nazwa;
  d.nazwaOp = r.mno==='TMPL' ? [r.tmplCode,r.tmplName].filter(Boolean).join(' ') : [r.oplCode,r.oplName].filter(Boolean).join(' ');
  if(!d.zakres && r.task) d.zakres=r.task;
  const hw=r.sectors.filter(hwWork);
  const pick=(hw.length && hw.length<=4 ? hw : r.sectors.filter(s=>!s.removed)).slice(0,4);
  d.cfg=normCfg(d.cfg); d.cfg.sectors=Math.max(1,pick.length);
  for(let i=0;i<4;i++){ const s=pick[i]; d.cfg.map[i]=s?s.no:null; if(s){ const x=secDefaults(s,r); d.cfg.secAnt[i]=x.ant; d.cfg.secRru[i]=x.rru; } }
}

function slug(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L').replace(/→/g,'-').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60); }

/* ======================= Zdjęcia ======================= */
function imgFrom(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('decode')); i.src=src; }); }
function readDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('read')); r.readAsDataURL(file); }); }
// dekodowanie z kilkoma metodami zapasowymi (blob URL -> data URL -> createImageBitmap)
async function decodeImage(file){
  const errs=[];
  if(NATIVE && window.createImageBitmap){
    try{ const b=await createImageBitmap(file,{imageOrientation:'from-image'}); return {src:b,w:b.width,h:b.height,done:()=>b.close&&b.close()}; }
    catch(e){ errs.push('bitmap0'); }
  }
  let u=null;
  try{ u=URL.createObjectURL(file); const i=await imgFrom(u); return {src:i,w:i.naturalWidth,h:i.naturalHeight,done:()=>URL.revokeObjectURL(u)}; }
  catch(e){ errs.push('blob'); if(u) URL.revokeObjectURL(u); }
  try{ const i=await imgFrom(await readDataURL(file)); return {src:i,w:i.naturalWidth,h:i.naturalHeight,done:()=>{}}; }
  catch(e){ errs.push('dataurl'); }
  if(window.createImageBitmap){
    try{ const b=await createImageBitmap(file,{imageOrientation:'from-image'}); return {src:b,w:b.width,h:b.height,done:()=>b.close&&b.close()}; }
    catch(e){ errs.push('bitmap'); }
  }
  const heic=/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name||'');
  const err=new Error(heic?'heic':'decode'); err.detail=`${file.type||'brak typu'}, ${(file.size/1048576).toFixed(1)} MB, ${errs.join('/')}`; throw err;
}
function canvasBlob(img,w,h,max,q){
  const s=Math.min(1,max/Math.max(w,h)); const cw=Math.round(w*s), ch=Math.round(h*s);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const ctx=c.getContext('2d'); if(!ctx) return Promise.reject(new Error('canvas'));
  ctx.drawImage(img,0,0,cw,ch);
  return new Promise((res,rej)=>{
    try{ c.toBlob(b=>{ if(b) return res({b,cw,ch,canvas:c});
      try{ const d=c.toDataURL('image/jpeg',q); const bin=atob(d.split(',')[1]); const a=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) a[k]=bin.charCodeAt(k); res({b:new Blob([a],{type:'image/jpeg'}),cw,ch}); }
      catch(e){ rej(new Error('encode')); } },'image/jpeg',q); }
    catch(e){ rej(new Error('encode')); }
  });
}
async function processFile(file){
  const d=await decodeImage(file);
  try{
    if(!d.w||!d.h) throw new Error('decode');
    let full;
    try{ full=await canvasBlob(d.src,d.w,d.h,S.quality,0.88); }
    catch(e){ full=await canvasBlob(d.src,d.w,d.h,1600,0.86); } // mniejsza rozdzielczość, gdy brakuje pamięci
    const th=await canvasBlob(full.canvas||d.src,full.cw||d.w,full.ch||d.h,360,0.7);
    return {blob:full.b,thumb:th.b,w:full.cw,h:full.ch};
  } finally { d.done(); }
}
// Safari czasem nie zapisuje Blob w IndexedDB – wtedy zapisujemy bajty
async function toStored(ph){ const o={...ph}; for(const k of ['blob','thumb']) if(o[k] instanceof Blob) o[k]={ab:await o[k].arrayBuffer(),type:o[k].type||'image/jpeg'}; return o; }
function fromStored(ph){ for(const k of ['blob','thumb']){ const x=ph[k]; if(x && !(x instanceof Blob) && x.ab) ph[k]=new Blob([x.ab],{type:x.type||'image/jpeg'}); } return ph; }
async function storePhoto(ph){
  try{ await DB.put('photos',ph); return true; }
  catch(e1){ try{ await DB.put('photos',await toStored(ph)); return true; } catch(e2){ return false; } }
}
/* Zapis w tle: zdjęcie od razu pojawia się w aplikacji, przetwarzanie idzie w kolejce, można robić następne. */
const Q={jobs:[],running:false};
S.pending={}; // slotKey -> [{id,url}]
function pendingOf(k){ return S.pending[k]||[]; }
function queueBusy(){ return Q.running||Q.jobs.length>0; }
function addFiles(files,source){
  if(!files.length||!S.cur||!S.p) return;
  const {f,n}=S.cur; const k=slotKey(f,n); const pid=S.p.id;
  const wasEmpty=!peek(S.p,k).takes.length && !pendingOf(k).length;
  for(const file of files){
    const id='q'+uid(); const url=URL.createObjectURL(file);
    (S.pending[k]=S.pending[k]||[]).push({id,url});
    Q.jobs.push({file,id,url,k,pid,f,n});
  }
  S.lastError=null; S.confirm=null;
  const sl=slot(S.p,k); sl.skip=false;
  toast(k.startsWith('common/')&&S.p.reports.length>1?`Zdjęcie ${n} – zapisuję w tle (wszystkie raporty)`:`${f}/${n}.jpg – zapisuję w tle`);
  if(S.autoNext && source==='cam' && wasEmpty && S.view==='shoot') step(1); else keepScroll(render);
  runQueue();
}
async function runQueue(){
  if(Q.running) return; Q.running=true; updateQueueBadge();
  while(Q.jobs.length){
    const j=Q.jobs.shift(); updateQueueBadge();
    let err=null, memOnly=false, ph=null;
    try{
      const r=await processFile(j.file);
      ph={id:uid(),projectId:j.pid,slot:j.k,created:Date.now(),...r};
      if(!(await storePhoto(ph))) memOnly=true;
      S.photos.set(ph.id,ph);
    }catch(e){ err=e; }
    // przypisanie do stacji (także gdy użytkownik zmienił w międzyczasie stację)
    let p = S.p&&S.p.id===j.pid ? S.p : null;
    if(!p){ try{ p=await DB.get('projects',j.pid); }catch(e){} }
    if(p && ph){ const sl=slot(p,j.k); sl.takes.push(ph.id); sl.chosen=ph.id; sl.skip=false; p.updated=Date.now(); try{ await DB.put('projects',p); }catch(e){} }
    S.pending[j.k]=pendingOf(j.k).filter(x=>x.id!==j.id); if(!S.pending[j.k].length) delete S.pending[j.k];
    URL.revokeObjectURL(j.url);
    if(err){
      const msg = err.message==='heic'
        ? `Zdjęcie ${j.f}/${j.n}: ten telefon nie umie otworzyć formatu HEIC (${err.detail}). Ustaw w aparacie JPG.`
        : `Zdjęcie ${j.f}/${j.n} nie zapisało się (${err.message}${err.detail?', '+err.detail:''}). Zrób je jeszcze raz.`;
      S.lastError=msg; toast(msg);
    }
    if(memOnly) S.lastError='Uwaga: telefon nie pozwolił zapisać zdjęcia w pamięci aplikacji. Pobierz ZIP przed zamknięciem.';
    if(S.view==='shoot'||S.view==='station') keepScroll(render);
    updateQueueBadge();
  }
  Q.running=false; updateQueueBadge();
}
function waitQueue(){ return new Promise(res=>{ const t=()=>queueBusy()?setTimeout(t,200):res(); t(); }); }
function updateQueueBadge(){
  let el=document.getElementById('qbadge');
  const n=Q.jobs.length+(Q.running?1:0);
  if(!el){ el=document.createElement('div'); el.id='qbadge'; el.className='qbadge'; document.body.appendChild(el); }
  el.hidden=!n; el.textContent=n?`Zapisuję zdjęcia w tle: ${n}`:'';
}
for(const id of ['cam','gal']){
  const el=document.getElementById(id);
  el.addEventListener('change',()=>{ const fs=[...el.files]; el.value=''; addFiles(fs,id); });
}

    dir.file('_fotoraport_dane.json',JSON.stringify({app:'fotoraport',v:1,project:{nr:p.nr,nazwa:p.nazwa,nazwaOp:p.nazwaOp,data:p.data,firma:p.firma,zakres:p.zakres,zam:p.zam,reports:p.reports,cfg:p.cfg,g5:p.g5||null,tpl:tplOf(p),inne:p.inne||[]},skip:Object.keys(p.slots).filter(k=>p.slots[k].skip)}));
    if(p.reports.includes('Inne') && (p.inne||[]).length) dir.folder('Inne').file('opisy.txt',p.inne.map(x=>`Zdjęcie ${x.n}: ${x.opis}`).join('\r\n'));
    if(NATIVE){
      const path=await nativeSaveZip(zip,root);
      busy(false); toast('ZIP zapisany');
      show(`Zapisano w telefonie: ${path}. Plik znajdziesz w aplikacji Pliki → Pobrane → CellnexNokia.`);
      const sb=document.getElementById('shareBtn'); if(sb) sb.hidden=false;
      return;
    }
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'},m=>{document.getElementById('busyText').textContent=`Pakowanie… ${Math.round(m.percent)}%`;});
    busy(false);
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(!dl){ show('Pobieranie plików nie działa w tym widoku. Otwórz tę stronę w aplikacji Claude albo w przeglądarce, będąc zalogowanym.'); return; }
    try{ await dl.save({filename:root+'.zip',data:blob}); toast('ZIP zapisany'); show(`Zapisano ${root}.zip (${(blob.size/1048576).toFixed(1)} MB).`); }
    catch(e){
      const c=e&&e.code;
      if(c==='declined') show('Pobieranie anulowane.');
      else if(c==='too_large') show('Paczka jest za duża dla tej aplikacji. Ustaw mniejszą rozdzielczość albo pobierz bez dodatkowych ujęć.');
      else if(c==='rate_limited') show('Okno zapisu jest już otwarte. Spróbuj za chwilę.');
      else show('Nie udało się zapisać pliku ('+(c||'błąd')+').');
    }
  }catch(e){ busy(false); show('Błąd pakowania: '+(e.message||e)); }
  finally{ S.exporting=false; }
}

const NATIVE = !!window.AndroidBridge;
function u8b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function nativeSaveZip(zip,root){
  return new Promise((res,rej)=>{
    const B=window.AndroidBridge; const id=B.fileBegin('download','',root+'.zip','application/zip');
    if(!id) return rej(new Error('nie mogę utworzyć pliku w Pobranych'));
    let buf=[],len=0,failed=false;
    const flush=()=>{ if(!len) return; const all=new Uint8Array(len); let o=0; for(const c of buf){ all.set(c,o); o+=c.length; } buf=[]; len=0;
      if(!B.fileAppend(id,u8b64(all))) throw new Error('błąd zapisu (brak miejsca?)'); };
    const st=zip.generateInternalStream({type:'uint8array',compression:'STORE',streamFiles:true});
    st.on('data',(c,m)=>{ if(failed) return; buf.push(c); len+=c.length;
        if(len>=1048576){ try{ flush(); }catch(e){ failed=true; B.fileAbort(id); st.pause(); rej(e); return; } }
        const bt=document.getElementById('busyText'); if(bt) bt.textContent=`Zapisywanie ZIP… ${Math.round(m.percent)}%`; })
      .on('error',e=>{ if(!failed){ failed=true; B.fileAbort(id); rej(e); } })
      .on('end',()=>{ if(failed) return; try{ flush(); const path=B.fileEnd(id); if(!path) throw new Error('nie udało się zamknąć pliku'); res(path); }catch(e){ B.fileAbort(id); rej(e); } })
      .resume();
  });
}
function backupDir(p){ return [p.nr, p.nazwa].filter(Boolean).join('_').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60) || 'stacja'; }
function backupName(p,f,n){ const k=slotKey(f,n,p); if(k==='common/prad') return 'Wspolne_prad_poboru'; if(k.startsWith('common/')) return 'Wspolne_'+n; return (RMAP[f]?RMAP[f].short:f).replace(/\s+/g,'')+'_'+n; }
const APP_VERSION='1.1';
function applyBackupQ(){ if(NATIVE && typeof AndroidBridge.setBackupQuality==='function'){ try{ AndroidBridge.setBackupQuality(S.backupQ); }catch(e){} } }
function setCaptureTarget(){ if(NATIVE && S.p && S.cur){ try{ AndroidBridge.setCaptureTarget(backupDir(S.p), backupName(S.p,S.cur.f,S.cur.n)); }catch(e){} } }

  if(document.getElementById('busy') && !document.getElementById('busy').hidden) return true;
  if(S.view==='shoot'||S.view==='export'){ S.mode=null; S.view='station'; render(); return true; }

  return false;

async function openProject(id){

}
function go(f,n){ S.cur={f,n}; S.confirm=null; S.lastError=null; S.view='shoot'; render(); }
function step(dir){
  const seq=sequence(S.p); const k=slotKey(S.cur.f,S.cur.n);
  const i=seq.findIndex(x=>slotKey(x.f,x.n)===k)+dir;
  if(i<0) return; if(i>=seq.length){ const was=S.mode; S.mode=null; S.view='station'; render(); toast(was==='przed'?'Zdjęcia PRZED zrobione. Dla bezpieczeństwa pobierz teraz ZIP jako kopię.':'Koniec listy'); return; }
  S.tab=seq[i].f; go(seq[i].f,seq[i].n);
}

/* ======================= Wczytywanie G5 (PDF) ======================= */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); }); }
async function pdfLib(){
  if(window.FR_LOCAL_LIBS){ if(!pdfLib._m){ const m=await import('./pdf.js'); m.GlobalWorkerOptions.workerSrc='./pdf.worker.js'; pdfLib._m=m; } return pdfLib._m; }
  if(window.pdfjsLib) return window.pdfjsLib;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.worker.min.js'); await loadScript(base+'pdf.min.js');
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; }catch(e){}
  return window.pdfjsLib;
}
async function pdfLines(file){
  const lib=await pdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;
  const lines=[]; lines.cols=[];
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i); const half=page.getViewport({scale:1}).width/2;
    const tc=await page.getTextContent(); const rows=[];
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){r={y,items:[]};rows.push(r);} r.items.push({x,s:it.str}); }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); lines.push(r.items.map(i=>i.s).join(' '));
      lines.cols.push({l:r.items.filter(i=>i.x<half).map(i=>i.s).join(' '), r:r.items.filter(i=>i.x>=half).map(i=>i.s).join(' ')}); }
  }
  return lines;
}
document.getElementById('g5file').addEventListener('change',async ev=>{

  busy(true,'Czytam G5…');
  let r=null, err='';
  try{ r=parseG5(await pdfLines(file)); if(!r) err='W tym PDF nie ma pola „N Code”. Czy to na pewno G5 N! Radio?'; }
  catch(e){ err= e&&e.message==='script' ? 'Nie udało się pobrać czytnika PDF. Sprawdź internet i spróbuj ponownie.' : 'Nie udało się odczytać tego PDF-a.'; }
  busy(false);
  if(r){ applyG5(S.draft,r); S.view='form'; render(); toast(`G5: ${r.nr} · ${r.sectors.length} sektorów`); }
  else { S.view='form'; render(); const e=document.getElementById('g5Err'); if(e){e.hidden=false;e.textContent=err;} }
});

/* ======================= Wczytywanie ZIP (kopia / zdjęcia z innego telefonu) ======================= */
const FOLDERS=REPORTS.map(r=>r.f);
async function importPhotoBlob(blob){
  const d=await decodeImage(blob);
  try{ const th=await canvasBlob(d.src,d.w,d.h,360,0.72);
    // zdjęcia z ZIP-a są już JPG z tej aplikacji albo z makra – zostawiamy oryginał, chyba że są za duże
    let full={b:blob,cw:d.w,ch:d.h};
    if(Math.max(d.w,d.h)>S.quality*1.25 || !/jpe?g/i.test(blob.type||'image/jpeg')) full=await canvasBlob(d.src,d.w,d.h,S.quality,0.9);
    return {blob:full.b,thumb:th.b,w:full.cw,h:full.ch};
  } finally { d.done(); }
}
document.getElementById('zipfile').addEventListener('change',async ev=>{
  const file=ev.target.files[0]; ev.target.value=''; if(!file) return;
  if(typeof JSZip==='undefined'){ toast('Nie wczytała się obsługa ZIP. Sprawdź internet i odśwież.'); return; }
  busy(true,'Czytam ZIP…');
  let zip; try{ zip=await JSZip.loadAsync(file); }catch(e){ busy(false); toast('To nie jest poprawny plik ZIP.'); return; }
  const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir);
  const metaName=names.find(n=>/(^|\/)_fotoraport_dane\.json$/i.test(n));
  let meta=null; if(metaName){ try{ meta=JSON.parse(await zip.files[metaName].async('string')); }catch(e){} }
  // stacja docelowa
  if(S.importNew || !S.p){
    const pr=(meta&&meta.project)||null;
    if(!pr){ busy(false); toast('W tym ZIP-ie nie ma danych stacji. Załóż stację i użyj „Wczytaj ZIP” w jej widoku.'); return; }
    const p={id:uid(),...pr,cfg:normCfg(pr.cfg),slots:{},created:Date.now(),updated:Date.now()};
    for(const k of (meta.skip||[])) p.slots[k]={takes:[],chosen:null,skip:true};
    await DB.put('projects',p); S.projects.push(p); await openProject(p.id);
  }
  const p=S.p; const tpl=tplOf(p);
  const files=[];
  for(const n of names){
    const m=n.match(/(?:^|\/)(_inne_ujecia\/)?([^\/]+)\/(\d+)(?:_v(\d+))?(?:_[^\/]*)?\.jpe?g$/i); if(!m) continue;
    const folder=FOLDERS.find(f=>f.toLowerCase()===m[2].toLowerCase()); if(!folder) continue;
    files.push({name:n,f:folder,n:+m[3],alt:!!m[1],v:+(m[4]||0)});
  }
  files.sort((a,b)=>a.alt-b.alt);
  if(!files.length){ busy(false); render(); toast('Nie znalazłem zdjęć w folderach tej stacji (np. 01_ANTENY albo BTS).'); return; }
  let added=0, skipped=0, same=0; const seenSlot=new Set();
  for(let i=0;i<files.length;i++){
    const x=files[i]; document.getElementById('busyText').textContent=`Wczytuję zdjęcia… ${i+1}/${files.length}`;
    if(x.f==='Inne' && x.n>1 && !(p.inne||[]).some(q=>q.n===x.n)) (p.inne=p.inne||[]).push({n:x.n,opis:'Zdjęcie z ZIP-a – uzupełnij opis'});
    const k=slotKey(x.f,x.n,p);
    const sig=x.name.replace(/^.*?\/(?=(_inne_ujecia\/)?[^\/]+\/[^\/]+$)/,'')+'|'+(zip.files[x.name]._data&&zip.files[x.name]._data.uncompressedSize||'');
    { const kk=k+'|'+(x.alt?'v'+x.v:'main'); if(seenSlot.has(kk)){ same++; continue; } seenSlot.add(kk); }
    const sl=slot(p,k);
    if(sl.takes.some(id=>S.photos.get(id)&&S.photos.get(id).src===file.name+':'+sig)){ skipped++; continue; }
    try{
      const blob=await zip.files[x.name].async('blob');
      const r=await importPhotoBlob(new Blob([blob],{type:'image/jpeg'}));
      const ph={id:uid(),projectId:p.id,slot:k,created:Date.now(),src:file.name+':'+sig,...r};
      await storePhoto(ph); S.photos.set(ph.id,ph);
      sl.takes.push(ph.id); if(!sl.chosen && !x.alt) sl.chosen=ph.id; sl.skip=false; added++;
    }catch(e){ skipped++; }
  }
  try{ await saveP(); }catch(e){}
  busy(false); S.view='station'; render();
  toast(added?`Wczytano ${added} zdjęć${skipped?`, pominięto ${skipped} (już były)`:''}. Gdzie było już zdjęcie, nowe jest kolejnym ujęciem do wyboru.`:`Nic nowego – te zdjęcia już są w stacji.`);
});

async function loadProjects(){ try{ S.projects=await DB.all('projects')||[]; }catch(e){ S.projects=[]; S.dbError=e&&e.message||'brak dostępu'; } }
async function showStorage(){
  try{ if(!navigator.storage||!navigator.storage.estimate) return; const e=await navigator.storage.estimate(); const el=document.getElementById('storage');
    if(el) el.textContent=`Zajęte na zdjęcia: ${(e.usage/1048576).toFixed(0)} MB. Usuń stację po wysłaniu raportu, żeby zwolnić miejsce.`; }catch(e){}
}
